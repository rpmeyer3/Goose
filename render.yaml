services:
  - type: web
    name: bytes-bank-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_URL
        value: https://your-app.vercel.app  # ← replace after Vercel deploy
      - key: PYTHON_VERSION
        value: 3.11.6
