<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Sparkle at tip -->
  <g opacity="0.9">
    <line x1="4" y1="1" x2="4" y2="7" stroke="#f0d78c" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="1" y1="4" x2="7" y2="4" stroke="#f0d78c" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="1.5" y1="1.5" x2="6.5" y2="6.5" stroke="#f0d78c" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
    <line x1="6.5" y1="1.5" x2="1.5" y2="6.5" stroke="#f0d78c" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  </g>
  <!-- Wand stick -->
  <line x1="6" y1="6" x2="28" y2="28" stroke="#d4a843" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Wand handle -->
  <line x1="22" y1="22" x2="28" y2="28" stroke="#8B6914" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Shine on wand -->
  <line x1="10" y1="9" x2="20" y2="19" stroke="#f0d78c" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
</svg>
