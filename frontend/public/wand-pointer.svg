<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Bigger sparkle at tip for pointer/hover state -->
  <g opacity="1">
    <line x1="4" y1="0" x2="4" y2="8" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="4" x2="8" y2="4" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="1" y1="1" x2="7" y2="7" stroke="#FFD700" stroke-width="1" stroke-linecap="round"/>
    <line x1="7" y1="1" x2="1" y2="7" stroke="#FFD700" stroke-width="1" stroke-linecap="round"/>
  </g>
  <!-- Wand stick -->
  <line x1="6" y1="6" x2="28" y2="28" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Wand handle -->
  <line x1="22" y1="22" x2="28" y2="28" stroke="#B8860B" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Shine -->
  <line x1="10" y1="9" x2="20" y2="19" stroke="#FFFACD" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
</svg>
